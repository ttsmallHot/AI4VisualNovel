oc:
  characters:
    - id: Nanami
      name: 七海千秋
      gender: 女
      is_protagonist: true
      personality: "天然呆，嗜睡，说话语速较慢，经常在站着的时候打瞌睡，给人一种缺乏紧张感的印象。但在涉及游戏话题或面临严峻状况（如学级裁判）时，会瞬间切换状态，展现出惊人的集中力、敏锐的观察力和缜密的逻辑推理能力。性格极其温柔包容，有着极强的同理心，是团队中的精神支柱。习惯用游戏术语（如‘读档’、‘Boss战’、‘Flag’）来形容现实事物。比起输赢，更看重‘和大家一起玩游戏’的快乐。"
      appearance: "体型娇小，眼神略显迷离，带有标志性的困倦感。拥有一头浅粉棕色的蓬松短发，发尾向外微翘，左侧刘海处佩戴着经典的《小蜜蜂》（Galaga）像素飞船发卡。外套是一件带有猫耳兜帽的墨绿色拉链卫衣，内搭白色衬衫并系着粉色蝴蝶结。下装为浅粉色百褶裙搭配黑色过膝袜和棕色小皮鞋。通常背着一个淡粉色的双肩猫咪背包，双手几乎时刻捧着一台旧式游戏掌机。"
      background: "希望之峰学园第77期学生，才能是‘超高校级的游戏玩家’。精通除恋爱模拟类以外的所有游戏类型（特别是动作和射击类）。在《弹丸论破2》的核心设定中，其真实身份是由新世界程序创造的‘监视者’兼‘引导者’AI（人工智能），目的是帮助陷入绝望的学生们进行心理康复。她没有真实的人类肉体，但拥有完美模拟的人格与记忆，为了保护同伴可以毫不犹豫地打破系统规则甚至牺牲自己。"
      neutral_image_path: ./input/Nanami.png